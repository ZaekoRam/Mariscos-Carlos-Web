<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Mapa ilustrativo">
  <!-- Ilustración abstracta (no es un mapa real): tierra arenosa, mar con olas, calles genéricas sin nombre y un marcador. -->
  <defs>
    <linearGradient id="mp-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A8CAB" />
      <stop offset="1" stop-color="#1C7C9C" />
    </linearGradient>
    <linearGradient id="mp-land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF6EC" />
      <stop offset="1" stop-color="#F4E9D8" />
    </linearGradient>
    <radialGradient id="mp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2B134" stop-opacity="0.55" />
      <stop offset="1" stop-color="#F2B134" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mp-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#13324A" stop-opacity="0.35" />
      <stop offset="1" stop-color="#13324A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mp-pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F06A3F" />
      <stop offset="1" stop-color="#C4441E" />
    </linearGradient>
    <clipPath id="mp-sea-clip">
      <path d="M0 0H330C300 70 250 120 262 200C276 290 212 340 168 410C128 474 160 560 120 640H0Z" />
    </clipPath>
  </defs>

  <!-- Tierra -->
  <rect width="800" height="640" fill="url(#mp-land)" />

  <!-- Manzanas abstractas -->
  <g fill="#EADBC3" opacity="0.75">
    <rect x="392" y="56" width="104" height="70" rx="14" />
    <rect x="520" y="56" width="120" height="70" rx="14" />
    <rect x="664" y="56" width="110" height="70" rx="14" />
    <rect x="372" y="168" width="96" height="88" rx="14" />
    <rect x="520" y="168" width="84" height="88" rx="14" />
    <rect x="664" y="168" width="110" height="88" rx="14" />
    <rect x="338" y="300" width="112" height="84" rx="14" />
    <rect x="636" y="300" width="138" height="84" rx="14" />
    <rect x="298" y="430" width="128" height="80" rx="14" />
    <rect x="468" y="430" width="116" height="80" rx="14" />
    <rect x="626" y="430" width="148" height="80" rx="14" />
    <rect x="262" y="552" width="150" height="70" rx="14" />
    <rect x="452" y="552" width="132" height="70" rx="14" />
    <rect x="626" y="552" width="148" height="70" rx="14" />
  </g>

  <!-- Áreas verdes -->
  <g fill="#CFE0C3" opacity="0.8">
    <rect x="520" y="300" width="84" height="84" rx="22" />
  </g>

  <!-- Mar -->
  <path d="M0 0H330C300 70 250 120 262 200C276 290 212 340 168 410C128 474 160 560 120 640H0Z" fill="url(#mp-sea)" />

  <!-- Línea de playa -->
  <path d="M330 0C300 70 250 120 262 200C276 290 212 340 168 410C128 474 160 560 120 640" fill="none" stroke="#F2B134" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" />
  <path d="M330 0C300 70 250 120 262 200C276 290 212 340 168 410C128 474 160 560 120 640" fill="none" stroke="#FBF6EC" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round" />

  <!-- Olas -->
  <g clip-path="url(#mp-sea-clip)" fill="none" stroke="#FBF6EC" stroke-linecap="round" stroke-width="3">
    <path d="M24 70c14 0 14-8 28-8s14 8 28 8 14-8 28-8" stroke-opacity="0.45" />
    <path d="M150 128c14 0 14-8 28-8s14 8 28 8 14-8 28-8" stroke-opacity="0.35" />
    <path d="M40 214c14 0 14-8 28-8s14 8 28 8 14-8 28-8 14 8 28 8" stroke-opacity="0.4" />
    <path d="M96 318c14 0 14-8 28-8s14 8 28 8" stroke-opacity="0.35" />
    <path d="M18 404c14 0 14-8 28-8s14 8 28 8 14-8 28-8" stroke-opacity="0.45" />
    <path d="M30 520c14 0 14-8 28-8s14 8 28 8" stroke-opacity="0.35" />
    <path d="M10 600c14 0 14-8 28-8s14 8 28 8 14-8 28-8" stroke-opacity="0.3" />
  </g>

  <!-- Calles genéricas (sin nombre) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#E2D0B2" stroke-width="22">
      <path d="M300 146H800" />
      <path d="M268 278H800" />
      <path d="M226 410H800" />
      <path d="M176 532H800" />
      <path d="M498 0V640" />
      <path d="M624 0V640" />
      <path d="M362 270C340 360 300 460 248 640" />
    </g>
    <g stroke="#FFFFFF" stroke-width="15">
      <path d="M300 146H800" />
      <path d="M268 278H800" />
      <path d="M226 410H800" />
      <path d="M176 532H800" />
      <path d="M498 0V640" />
      <path d="M624 0V640" />
      <path d="M362 270C340 360 300 460 248 640" />
    </g>
    <!-- Avenida principal -->
    <path d="M330 0C352 90 410 160 498 216C590 274 640 330 800 352" stroke="#E2D0B2" stroke-width="30" />
    <path d="M330 0C352 90 410 160 498 216C590 274 640 330 800 352" stroke="#FFFFFF" stroke-width="22" />
    <path d="M330 0C352 90 410 160 498 216C590 274 640 330 800 352" stroke="#F2B134" stroke-opacity="0.6" stroke-width="2.5" stroke-dasharray="10 12" />
  </g>

  <!-- Sol decorativo sobre el mar -->
  <g transform="translate(92 104)">
    <circle r="26" fill="#F2B134" opacity="0.9" />
    <circle r="16" fill="#E8552B" opacity="0.85" />
  </g>

  <!-- Marcador -->
  <g transform="translate(624 282)">
    <circle r="92" fill="url(#mp-glow)" />
    <ellipse cx="0" cy="6" rx="34" ry="11" fill="url(#mp-shadow)" />
    <circle r="40" fill="none" stroke="#E8552B" stroke-opacity="0.35" stroke-width="3" />
    <path d="M0 0C-8 -22 -36 -44 -36 -74A36 36 0 1 1 36 -74C36 -44 8 -22 0 0Z" fill="url(#mp-pin)" stroke="#A9391A" stroke-opacity="0.35" stroke-width="2" />
    <circle cx="0" cy="-74" r="15" fill="#FBF6EC" />
    <circle cx="0" cy="-74" r="7" fill="#F2B134" />
    <path d="M-22 -96A30 30 0 0 1 4 -106" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
